[package]
name = "tpt-testkit"
description = "Unified testing, benchmarking and fuzzing infrastructure for the TPT ecosystem (dev-dependency only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["golden"]
golden = ["dep:similar", "dep:serde_json"]
bench = ["dep:criterion"]
fuzz = []
suite = []
property = []
# Isolated platform code (thread pinning, cache clearing); the only place unsafe is permitted.
platform-isolation = []
workspace-integration = []

[lints]
workspace = true

[dependencies]
criterion = { version = "0.7", optional = true }
serde_json = { version = "1", optional = true }
similar = { version = "2", optional = true }

[[bench]]
name = "self_check"
harness = false
required-features = ["bench"]
