[package]
name = "tpt-testkit"
description = "Unified testing, benchmarking and fuzzing infrastructure for the TPT ecosystem (dev-dependency only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["golden"]
golden = ["dep:similar", "dep:serde_json"]
bench = ["dep:criterion"]
fuzz = ["dep:serde", "dep:serde_json"]
# Edge-coverage feedback from nightly sancov instrumentation (isolated unsafe, see fuzz::sancov).
sancov = ["fuzz"]
suite = ["dep:sha2", "dep:serde", "dep:serde_json", "dep:tpt-testkit-macros"]
property = ["dep:proptest", "dep:serde_json"]
# Isolated platform code (thread pinning, cache clearing); the only place unsafe is permitted.
platform-isolation = []
# Host-side heap-budget emulation for no_std + alloc code.
nostd = []

[lints]
workspace = true

[dependencies]
criterion = { version = "0.7", optional = true }
proptest = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
similar = { version = "2", optional = true }
tpt-testkit-macros = { version = "0.1.0", path = "../tpt-testkit-macros", optional = true }

[[bench]]
name = "self_check"
harness = false
required-features = ["bench"]
