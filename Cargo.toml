[workspace]
resolver = "3"
members = [
    "crates/tpt-testkit",
    "crates/tpt-testkit-macros",
    "crates/tpt-testkit-cli",
    "crates/tpt-testkit-integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<ORG>/tpt-testkit"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
