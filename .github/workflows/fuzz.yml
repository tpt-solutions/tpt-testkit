name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fuzz:
    name: in-process fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # The corpus grows across runs: restore the most recent one, save a new one after each run.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/target/fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Run in-process fuzzing
        env:
          TPT_FUZZ_ITERATIONS: "500000"
          TPT_FUZZ_SEED: ${{ github.run_number }}
          TPT_FUZZ_CORPUS: ${{ github.workspace }}/target/fuzz-corpus
          TPT_FUZZ_CRASHES: ${{ github.workspace }}/target/fuzz-crashes
          TPT_FUZZ_REPORT: ${{ github.workspace }}/target/fuzz-report.json
        run: cargo test -p tpt-testkit --all-features --test fuzz_engine -- --nocapture
      - name: Group crashes by signature
        if: failure()
        run: cargo run -q -p tpt-testkit-cli -- crash-dedup --report target/fuzz-report.json
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            target/fuzz-crashes
            target/fuzz-report.json
          if-no-files-found: ignore
